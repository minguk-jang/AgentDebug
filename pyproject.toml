[project]
name = "langfuse-agent-debugger"
version = "0.1.0"
description = "Analyze Langfuse agent trajectories with AgentDebug"
requires-python = ">=3.10"
dependencies = [
    "langfuse>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
analyze = "main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detector", "langfuse_adapter", "agent", "main.py"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
